name: Portable Linux tester
on:
  pull_request:
  push:
    branches: [master, feat/portable-linux-runner]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Portable capture regression checks
        run: docker build -f tests/docker/capture.Dockerfile .
      - name: Build native tester and run mandatory/bonus synthetic fixtures
        run: |
          docker build -t supra-portable .
          python3 tests/check_container.py supra-portable
